[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awa"
version = "1.0.0"
description = "Alteryx Workflow Analyzer & Python Translator"
requires-python = ">= 3.11"
dependencies = [
    "lark>=1.1.0",
    "networkx>=3.0",
    "click>=8.0",
    "python-docx>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
awa = "awa.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/awa",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["backend", "."]
