[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awa"
version = "0.1.0"
description = "Alteryx Workflow Analyzer & Python Translator"
requires-python = ">= 3.11"
dependencies = [
    "lark>=1.1.0",
    "networkx>=3.0",
    "click>=8.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
]

[project.scripts]
awa = "awa.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/awa"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]
